name: Release security check (read-only)
# Status/header checks only (HTTP HEAD; no file content downloaded) of the live site and the
# release-check preview, plus file lists from the Firebase Hosting API with a read-only token.
# Lives only on branch diag/release-security-check; changes nothing.
on:
  push:
    branches:
      - diag/release-security-check
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status-only checks of live and preview
        env:
          SA_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNETRA_ULTRA }}'
        run: node .github/scripts/release-security-check.mjs
