name: App Check key switch (owner-approved, preview testing)
# One-time, owner-approved (12 Oct 2026): App Check reCAPTCHA Enterprise site key 6LfM...sDle -> 6Ld2...uKW4.
# Changes only that field. Idempotent. Runs only when this file or its script changes on the check branch.
on:
  push:
    branches:
      - diag/release-security-check
    paths:
      - '.github/workflows/appcheck-key-switch.yml'
      - '.github/scripts/appcheck-key-switch.mjs'
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch the App Check site key (siteKey field only)
        env:
          SA_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNETRA_ULTRA }}'
        run: node .github/scripts/appcheck-key-switch.mjs
