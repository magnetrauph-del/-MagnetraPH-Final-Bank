name: Trace the reCAPTCHA key (read-only)
# Where is the site key from firebase-init.js registered, and which addresses does Google accept for each key?
# GET/read calls and a local blank test page only. Nothing is created, changed or deleted. Check branch only.
on:
  push:
    branches:
      - diag/release-security-check
    paths:
      - '.github/workflows/key-trace.yml'
      - '.github/scripts/key-trace.mjs'
      - '.github/scripts/key-domain-test.mjs'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firebase App Check and Google Cloud projects (read-only)
        env:
          SA_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGNETRA_ULTRA }}'
        run: node .github/scripts/key-trace.mjs
      - name: Install headless Chromium (Playwright 1.47.2)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Ask Google how each key treats each address
        run: node .github/scripts/key-domain-test.mjs
