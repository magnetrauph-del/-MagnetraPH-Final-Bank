<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagnetraPH - Home</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body { margin:0; background:#0a0a0a; color:#fff; font-family:Inter, sans-serif; display:flex; justify-content:center; padding:24px; }
.card { width:100%; max-width:400px; background:#141414; border:1px solid #2a2a2a; border-radius:16px; padding:20px; }
#balance { font-size:32px; font-weight:700; margin:10px 0; }
button { width:100%; height:48px; border-radius:12px; border:none; background:#fff; color:#000; font-weight:600; margin-top:12px; cursor:pointer; }
.small { font-size:13px; color:#888; }
</style>
</head>
<body>
<div class="card">
<div class="small">Logged in as</div>
<div id="userEmail">---</div>
<div class="small" style="margin-top:16px">Available Balance</div>
<div id="balance">0.00</div>
<button onclick="doLogout()">Logout</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...LAGAY_MO_TUNAY_NA_API_KEY_MO",
  authDomain: "x-ultra-5a5ea.firebaseapp.com",
  projectId: "x-ultra-5a5ea"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const balanceEl = document.getElementById('balance');
const emailEl = document.getElementById('userEmail');

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  if (emailEl) emailEl.textContent = user.email;

  try {
    const lockRef = db.collection("users").doc(user.uid).collection("security").doc("lockout");
    const lockSnap = await lockRef.get();
    if (lockSnap.exists) {
      const ld = lockSnap.data();
      if (ld.lockUntil && Date.now() < ld.lockUntil) {
        await auth.signOut();
        location.href = "login.html";
        return;
      }
    }

    const walletRef = db.collection("wallets").doc(user.uid);
    const walletSnap = await walletRef.get();

    if (!walletSnap.exists) {
      await walletRef.set({
        uid: user.uid,
        balance: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      if (balanceEl) balanceEl.textContent = "0.00";
    } else {
      const data = walletSnap.data();
      if (balanceEl) balanceEl.textContent = Number(data.balance || 0).toFixed(2);
    }

    walletRef.onSnapshot((doc) => {
      if (doc.exists) {
        const d = doc.data();
        if (balanceEl) balanceEl.textContent = Number(d.balance || 0).toFixed(2);
      }
    });

  } catch (e) {
    console.log("error", e);
  }
});

async function doLogout() {
  await auth.signOut();
  localStorage.clear();
  sessionStorage.clear();
  location.href = "login.html";
}
</script>
</body>
</html>
