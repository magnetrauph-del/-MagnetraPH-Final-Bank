<div id="walletCard" style="background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;padding:20px;color:#fff">
  <p style="opacity:.7;font-size:12px">Wallet Balance</p>
  <h2 id="bal" style="font-size:32px;font-weight:900;margin:4px 0">₱0.00</h2>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button id="cashInBtn" style="flex:1;background:#fff;color:#5A20FF;border:none;border-radius:10px;padding:12px;font-weight:800">Cash In</button>
    <button id="cashOutBtn" style="flex:1;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px;font-weight:800">Cash Out</button>
  </div>
</div>
<script type="module">
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const fns=getFunctions(app); // app galing sa CFG mo
const ensureWalletFn=httpsCallable(fns,'ensureWallet');
await ensureWalletFn({did: window.MPH.D()});
 // tapos read wallet doc lang - bawal write
import{doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
onSnapshot(doc(db,'wallets',auth.currentUser.uid),(s)=>{
  if(s.exists()) $('bal').textContent = '₱'+(s.data().balance||0).toLocaleString('en-PH',{minimumFractionDigits:2});
});
</script>
