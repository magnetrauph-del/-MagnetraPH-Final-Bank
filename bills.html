<!DOCTYPE html>
<html lang="en">

<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0a0f;color:#e5e7eb;font-family:Inter,system-ui,sans-serif}
.card{background:linear-gradient(145deg,#14141f,#0e0e18);border:1px solid rgba(139,92,246,0.18);border-radius:18px}
.input{background:#0f0f1a;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:12px 14px;width:100%;color:#fff;outline:none}
.input:focus{border-color:rgba(139,92,246,0.6);box-shadow:0 0 0 3px rgba(139,92,246,0.15)}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);border-radius:14px;padding:14px;font-weight:700;letter-spacing:.02em}
.btn-purple:disabled{opacity:.6}
.badge{background:linear-gradient(135deg,#7c3aed,#4c1d95);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800}

<body class="min-h-screen p-4">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-between mb-5">
<button id="backBtn" class="px-3 py-2 rounded-xl bg-[#14141f] border border-purple-900/30">Back</button>
<div id="topTitle" class="font-bold text-[15px] tracking-wide">Bills and Services</div>
<div class="w-[56px]"></div>
</div>

<div class="card p-4 mb-4 flex items-center gap-3">
<div id="badgeLetter" class="badge">L</div>
<div>
<div id="badgeTitle" class="font-bold">Load</div>
<div id="badgeSub" class="text-xs text-zinc-400">Commission</div>
</div>
<div class="ml-auto text-right">
<div class="text-[11px] text-zinc-400">Commission</div>
<div id="commissionValue" class="text-sm font-bold text-purple-300">₱3.00 - ₱5.00</div>
</div>
</div>

<div class="card p-4 mb-4">
<div class="text-[11px] text-zinc-400 mb-3">Secure Payment - PayMongo and Google Play - MagnetraPH does not hold your funds</div>

<div id="formLoad" class="space-y-3">
<input id="loadNumber" class="input" placeholder="11 digit number - 09xxxxxxxxx" inputmode="numeric">
<select id="loadAmount" class="input">
<option value="">Select amount</option>
<option value="10">10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option>
</select>
</div>

<div id="formBills" class="space-y-3 hidden">
<select id="billsBiller" class="input">
<option value="">Select biller</option>
<option value="MERALCO">MERALCO</option><option value="MAYNILAD">MAYNILAD</option><option value="PLDT">PLDT</option><option value="GLOBE">GLOBE</option><option value="CONVERGE">CONVERGE</option>
</select>
<input id="billsAccount" class="input" placeholder="Account number">
<input id="billsAmount" class="input" placeholder="Amount - min 50" inputmode="numeric">
</div>

<div id="formCash" class="space-y-3 hidden">
<select id="cashType" class="input"><option value="CASHIN">Cash In</option><option value="CASHOUT">Cash Out</option></select>
<select id="cashWallet" class="input"><option value="GCASH">GCash</option><option value="MAYA">Maya</option></select>
<input id="cashNumber" class="input" placeholder="11 digit number" inputmode="numeric">
<input id="cashAmount" class="input" placeholder="Amount - min 10" inputmode="numeric">
</div>

<div id="formBank" class="space-y-3 hidden">
<select id="bankName" class="input">
<option value="">Select bank</option><option value="BDO">BDO</option><option value="BPI">BPI</option><option value="GCASH_BANK">GCash Bank</option><option value="MAYA_BANK">Maya Bank</option>
</select>
<input id="bankAccount" class="input" placeholder="Account number">
<input id="bankAmount" class="input" placeholder="Amount - min 50" inputmode="numeric">
</div>
</div>

<button id="payBtn" class="btn-purple w-full">Proceed Secure Payment</button>
<div class="mt-3 text-[10px] text-zinc-500 text-center">Secured by Firebase App Check reCAPTCHA Enterprise - Server Authoritative - PENDING only - Server will mark PAID after verification</div>
</div>
