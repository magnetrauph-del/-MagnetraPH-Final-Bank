<script>
// Tap, click, o pagkalipas ng 3 segundo: isang beses lang lilipat sa login.html.
// location.replace: hindi na naiiwan ang Intro sa history, kaya ang Back sa Login ay hindi na bumabalik dito
// (ang exit guard ng Login ang bahala sa Back). Walang tunog at walang localStorage.
(function () {
  var home = document.getElementById("home");
  var wrap = document.getElementById("wrap");
  var leaving = false;
  function go() {
    if (leaving) return;
    leaving = true;
    wrap.classList.add("out");
    home.classList.add("out");
    setTimeout(function () { location.replace("login.html"); }, 750);
  }
  home.addEventListener("click", go, { once: true });
  home.addEventListener("touchstart", go, { once: true, passive: true });
  setTimeout(go, 3000);
})();
</script>
