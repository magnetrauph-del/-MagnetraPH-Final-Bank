(()=>{const SEAL="m9x7p2-utak-v3-intro";Object.freeze({SEAL});localStorage.setItem("_mph_intro",SEAL);

const alive=()=>{if(played)return;played=true;try{const C=new(window.AudioContext||window.webkitAudioContext)();const ct=C.currentTime;const m=C.createGain();m.gain.setValueAtTime(0,ct);m.gain.linearRampToValueAtTime(0.8,ct+0.1);m.gain.exponentialRampToValueAtTime(0.0001,ct+1.2);m.connect(C.destination);[1,1.5,2,4].forEach((mu,i)=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=174.61*mu;o.type=i==0?'triangle':'sine';g.gain.value=[0.26,0.16,0.12,0.05][i];o.connect(g);g.connect(m);o.start(ct);o.stop(ct+1.2);});}catch{}};
const checkDevice=Object.freeze(()=>{try{let ua=navigator.userAgent.toLowerCase();if(/emulator|bluestacks|ldplayer|nox|memu|genymotion|android sdk built/.test(ua))return{ok:false,msg:"Bawal sa emulator - tunay na phone lang"};if(navigator.webdriver===true||/headless|phantomjs|selenium/.test(ua))return{ok:false,msg:"Bot detected"};if(/android\s[1-4]\./.test(ua))return{ok:false,msg:"Luma Android - need Android 5+"};if(/os\s([1-9]|10|11)_/.test(ua))return{ok:false,msg:"Luma iPhone - need iOS 12+"};if(!window.localStorage||!window.fetch)return{ok:false,msg:"Hindi supported browser"};return{ok:true};}catch{return{ok:true};}});
const go=()=>{if(k)return;let chk=checkDevice();if(!chk.ok){h.style.display='none';b.style.display='grid';r.textContent=chk.msg;return;}k=true;try{alive();}catch{}w.classList.add('out');h.classList.add('out');setTimeout(()=>{location.href='login.html';},750);};
h.addEventListener('click',go,{once:true});h.addEventListener('touchstart',go,{once:true,passive:true});setTimeout(go,3000);
})();
