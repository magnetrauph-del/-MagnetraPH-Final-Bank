<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MagnetraPH - Verify</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style id="D-VERIFY" data-lock="OWNER" data-modulock="SEALED" data-folder="5-DESIGN">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;overflow:hidden}
a,button{outline:none!important;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(700px at 50% -10%,#2a1d6a 0%,#0e061e 38%,#000 75%);padding:16px}
#card{width:100%;max-width:380px;background:rgba(18,10,36,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:28px;padding:28px 22px;box-shadow:0 24px 80px rgba(123,47,255,0.45);transition:transform .35s ease, opacity .35s ease;position:relative}
#card.page-exit{transform:translateY(20px) scale(.97);opacity:0}
#backBtn{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer}
#backBtn svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
#icon{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;margin:8px auto 14px;background:linear-gradient(180deg,#C39CFF 0%,#7B2FFF 55%,#3E18E0 100%);border:1px solid rgba(255,255,255,0.4);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.8),0 12px 40px #7B2FFF88}
#icon b{color:#fff;font:800 34px/1 sans-serif}
h1{color:#fff;text-align:center;margin:0;font:800 22px/1 sans-serif}
p.blue{color:#4DA3FF;text-align:center;margin:8px 0 20px;font:600 13px/1.4 sans-serif}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:700 14px sans-serif;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center}
#btnMain{background:linear-gradient(180deg,#5EAFFF 0%,#2F7CFF 100%);color:#fff;box-shadow:0 10px 30px rgba(47,124,255,0.5)}
#btnSec{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.14);margin-top:10px}
#status{color:#9A7DFF;text-align:center;margin-top:14px;font:500 11px/1.4 sans-serif;min-height:14px}
#exitToast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);color:#fff;padding:10px 18px;border-radius:24px;font:600 12px sans-serif;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:9999}
#exitToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="bg">
<div id="card" data-lock="OWNER" data-modulock="SEALED">
<button id="backBtn" onclick="goPage(event,'login.html')"><svg viewBox="0 0 24 24"><path d="M15 18L9 12L15 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="icon"><b>U</b></div>
<h1>Check Your Inbox</h1>
<p class="blue">We sent a verification link to your email. Check Inbox and SPAM folder.</p>
<button class="btn" id="btnMain" onclick="checkVerified()">I Verified My Email</button>
<button class="btn" id="btnSec" onclick="resend()">Resend Link</button>
<div id="status"></div>
</div>
</div>
<div id="exitToast">Tap again to exit</div>
<script id="CFG-VERIFY" data-lock="OWNER" data-modulock="SEALED">
const firebaseConfig = { apiKey: "ILAGAY_API_KEY_MO_DITO", authDomain: "PROJECT_MO.firebaseapp.com", projectId: "PROJECT_MO" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
</script>
<script id="S-VERIFY-MASTER" data-lock="OWNER" data-modulock="SEALED">
(function(){const must=document.querySelectorAll('[data-lock="OWNER"][data-modulock="SEALED"]');if(must.length<3){document.documentElement.innerHTML='';}const s=document.getElementById('D-VERIFY');if(!s||s.getAttribute('data-lock')!=='OWNER'){document.documentElement.innerHTML='';}})();
function goPage(e,url){if(e)e.preventDefault();document.getElementById('card').classList.add('page-exit');setTimeout(()=>{location.href=url;},350);return false;}
async function checkVerified(){const status=document.getElementById('status');status.innerText='Checking...';const user=auth.currentUser;if(!user){await auth.authStateReady; }const cur=auth.currentUser;if(!cur){status.innerText='Please login again to verify.';setTimeout(()=>goPage(null,'login.html'),1000);return;}await cur.reload();if(cur.emailVerified){status.innerText='Verified! Redirecting...';goPage(null,'home.html');}else{status.innerText='Not verified yet. Check inbox.';}}
async function resend(){const status=document.getElementById('status');try{const user=auth.currentUser;if(!user){status.innerText='Login first to resend.';return;}await user.sendEmailVerification();status.innerText='Link resent! Check SPAM.';}catch(err){status.innerText='Error: '+err.message;}}
let lastBackTap=0;history.pushState(null,null,location.href);window.addEventListener('popstate',()=>{const now=Date.now();const toast=document.getElementById('exitToast');if(now-lastBackTap<2000){toast.classList.remove('show');setTimeout(()=>{try{window.close();}catch(e){}history.go(-1);},150);}else{lastBackTap=now;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);history.pushState(null,null,location.href);}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if((e.ctrlKey&&(e.key==='u'||e.key==='s'))||e.key==='F12'){e.preventDefault();}});
</script>
</body>
</html>
