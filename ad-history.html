*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F9F8FD;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
#bg{position:fixed;inset:0;background:#F9F8FD;padding:20px 16px;overflow:auto;display:grid;place-items:start center}
#card{width:100%;max-width:400px;background:#fff;border:1px solid #F0EDFF;border-radius:28px;padding:22px;box-shadow:0 2px 18px rgba(27,24,42,.04);margin:8px 0 36px 0}
#backRow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#backBtn{width:38px;height:38px;border-radius:12px;background:#F9F8FD;border:1px solid #F0EDFF;display:grid;place-items:center;cursor:pointer}
#backTitle{color:#111115;font:700 16px/1.2 Inter,sans-serif;letter-spacing:-.2px}
.sectionTitle{color:#111115;font:700 15px/1.2 Inter,sans-serif;letter-spacing:-.2px;margin:20px 0 5px 2px}
.sectionSub{color:#8C8BA1;font:400 12.5px/1.5 Inter,sans-serif;margin:0 0 14px 2px}
#list{display:grid;gap:14px;margin:14px 0}
.item{background:#fff;border:1px solid #F0EDFF;border-radius:20px;padding:16px;cursor:pointer}
.itemTop{display:flex;justify-content:space-between;align-items:center}
.itemName{color:#111115;font:600 13.5px/1.2 Inter,sans-serif}
.itemBadge{display:inline-flex;background:#F3F0FF;color:#6D5DD3;border:1px solid #E9E4FF;border-radius:20px;padding:5px 9px;font:600 9px/1 Inter;letter-spacing:.5px;text-transform:uppercase}
.itemSub{color:#8C8BA1;font:400 11.5px/1.4 Inter,sans-serif;margin-top:6px}
.itemPhotos{display:flex;gap:8px;margin-top:10px}
.itemPhotos img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#F7F6FF;border:1px solid #F0EDFF}
.itemAction{margin-top:12px;display:flex;gap:10px}
.btnSmall{flex:1;background:#111115;color:#fff;border:0;border-radius:12px;padding:11px;text-align:center;font:600 12px/1 Inter,sans-serif;cursor:pointer}
.btnSmall.secondary{background:#F9F8FD;color:#111115;border:1px solid #F0EDFF}
.btnSmall:disabled{opacity:0.5;cursor:not-allowed}
#empty{color:#8C8BA1;text-align:center;font:400 12.5px/1.5 Inter,sans-serif;padding:24px 0}
#secureNote{color:#A8A6B8;text-align:center;font:400 10px/1.5 Inter,sans-serif;margin-top:14px}
#status{margin-top:12px;padding:10px 12px;background:#F3F0FF;border:1px solid #E9E4FF;border-radius:12px;color:#6D5DD3;font:500 11.5px/1.4 Inter,sans-serif;display:none}
#status.show{display:block}

<script src="security-dashboard.js"></script>
<script type="module" data-lock="OWNER" data-modulock="SEALED">
// CONNECT LAHAT - by order - firebase + appcheck + firestore + storage + security-dashboard V4 - videoLock - preview_only watermark_720p no_download_until_paid - bank level - 20 years - no emoji
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";

const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_PROJECT.appspot.com", appId: "YOUR_APP_ID" };
const app = initializeApp(firebaseConfig);
try{ const appCheck = initializeAppCheck(app, { provider: new ReCaptchaV3Provider('YOUR_RECAPTCHA_V3_SITE_KEY'), isTokenAutoRefreshEnabled: true }); }catch(e){}
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let userData = null;

onAuthStateChanged(auth, async (user)=>{
if(!user){ window.location.href='login.html'; return; }
currentUser = user;
try{
const uSnap = await getDoc(doc(db,'users',user.uid));
if(uSnap.exists()) userData = uSnap.data();
loadAds();
}catch(e){ showStatus('Error loading user - sealed'); }
});

async function loadAds(){
const listEl = document.getElementById('list');
try{
const q = query(collection(db,'transactions'), where('uid','==',currentUser.uid), where('type','==','video'), orderBy('createdAt','desc'));
const snap = await getDocs(q);
if(snap.empty){ listEl.innerHTML = '<div id="empty">No video ads yet - Create your first - Secure - Sealed</div>'; return; }
listEl.innerHTML = '';
snap.forEach((docSnap)=>{
const data = docSnap.data();
const id = docSnap.id;
const productName = data.productName || 'Video Ad';
const adType = data.adType || 'promo';
const status = data.status || 'PENDING';
const photos = data.photos || [];
const finalVideo = data.finalVideoUrl || data.videoUrl || null;

// videoLock - preview_only watermark_720p no_download_until_paid - connect sa security-dashboard.js V4 - sealed - bank level - 20 years
let lock = { allowPreview: true, allowDownload: false, quality: '720p_watermark_streaming_only' };
if(window.SecurityDashboard){
const mockUser = { gold: userData?.gold || userData?.isGold || false, isGold: userData?.isGold || false };
const mockTrx = { status: status, type: 'video' };
lock = window.SecurityDashboard.videoLock({ status: status, gold: mockUser.gold });
if(!window.SecurityDashboard.canDownloadVideo(mockUser, mockTrx)){ lock.allowDownload = false; }
else { if(status==='PAID' && finalVideo){ lock.allowDownload = true; lock.quality = '1080p_no_watermark'; } }
}

let badgeText = status;
if(status==='PENDING') badgeText = 'PENDING - Preview Only';
if(status==='PAID') badgeText = 'PAID - Gold Access';

let photosHtml = '';
photos.slice(0,3).forEach((url)=>{ photosHtml += '<img src="' + url + '">'; });

let actionHtml = '';
if(lock.allowDownload && finalVideo){
actionHtml = '<div class="itemAction"><button class="btnSmall" onclick="downloadVideo(\'' + finalVideo + '\')">Download - 1080p - No Watermark</button><button class="btnSmall secondary" onclick="previewVideo(\'' + id + '\')">Preview</button></div>';
}else{
actionHtml = '<div class="itemAction"><button class="btnSmall secondary" onclick="previewVideo(\'' + id + '\')">Preview - 720p Watermark - Streaming Only</button></div>';
}

const html = '<div class="item"><div class="itemTop"><div class="itemName">' + productName + '</div><div class="itemBadge">' + badgeText + '</div></div><div class="itemSub">Type - ' + adType + ' - ' + lock.quality + ' - Secure - No hold funds</div><div class="itemPhotos">' + photosHtml + '</div>' + actionHtml + '</div>';
listEl.innerHTML += html;
});

}catch(e){
console.log(e);
listEl.innerHTML = '<div id="empty">Error loading - ' + e.message + ' - sealed</div>';
}
}

window.downloadVideo = async function(url){
try{
if(!userData || (!userData.gold && !userData.isGold)){ showStatus('Gold required - 499 699 999 - access only - subscription commission 0 - sealed'); return; }
window.open(url, '_blank');
}catch(e){ showStatus('Download error - sealed'); }
};

window.previewVideo = function(id){
window.location.href='video-studio.html?id=' + id;
};

function showStatus(msg){
const el = document.getElementById('status');
el.textContent = msg;
el.classList.add('show');
setTimeout(()=>{ el.classList.remove('show'); }, 4000);
}
</script>
