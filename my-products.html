<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MagnetraPH - My Products</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#09080F;color:#fff;font-family:Inter,Segoe UI,Roboto,sans-serif;}
.top{position:sticky;top:0;z-index:100;background:#09080FE5;backdrop-filter:blur(16px);border-bottom:1px solid #1C1B2E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:900;font-size:18px;}
.logo b{color:#7C5CFF;}
.btn-back{background:#151325;border:1px solid #25233E;color:#fff;padding:0 16px;border-radius:20px;font-size:12px;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;}
.wrap{padding:16px;max-width:700px;margin:0 auto;}
.header-white{background:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,0.18);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.header-white b{color:#11111A;font-size:15px;font-weight:800;}
.header-white span{color:#7C5CFF;font-size:12px;font-weight:800;}
.btn-add{background:#7C5CFF;color:#fff;border:none;border-radius:20px;padding:0 16px;font-size:12px;font-weight:700;min-height:40px;text-decoration:none;box-shadow:0 6px 16px rgba(124,92,255,0.35);display:inline-flex;align-items:center;}
.list{display:flex;flex-direction:column;gap:12px;}
.item{background:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #F0EEFF;}
.item-img{width:64px;height:64px;background:#F3F0FF;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#7C5CFF;font-weight:900;font-size:18px;overflow:hidden;}
.item-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex:1;min-width:0;}
.item-info b{color:#11111A;font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-info p{color:#6E6D85;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-price{color:#7C5CFF;font-size:12px;font-weight:800;margin-top:4px;}
.item-actions{display:flex;flex-direction:column;gap:8px;}
.btn-small{padding:0 12px;border-radius:10px;font-size:11px;font-weight:700;min-height:34px;cursor:pointer;border:1px solid #E8E5FF;background:#fff;color:#11111A;min-width:60px;}
.btn-del{background:#FFF0F0;border-color:#FED7D7;color:#C53030;}
.btn-small:active{transform:scale(0.96);}
.empty{background:#151325;border:1px solid #25233E;border-radius:20px;padding:30px;text-align:center;color:#9A99B5;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="top">
<div class="logo">Magnetra<b>PH</b> - My Products</div>
<a href="dashboard.html" class="btn-back">Back</a>
</div>
<div class="wrap">
<div class="header-white">
<div><b>My Products</b><br><span id="count">0 / 3 Free</span></div>
<a href="products.html" class="btn-add">Add Product</a>
</div>
<div id="list" class="list"></div>
<div id="empty" class="empty" style="display:none;">No products yet. Add your first product. Free 3 max. Physical Digital Services Food - PayMongo Direct safe.</div>
</div>
<script src="appcheck.js"></script>
<script src="security.js"></script>
<script>
const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "magnetra-ultra.firebaseapp.com", projectId: "magnetra-ultra", appId: "YOUR_APP_ID" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user=>{
if(typeof Security!=='undefined' && Security.checkDomLock && Security.checkDomLock()){
document.documentElement.innerHTML="<div style='background:#000;color:#fff;padding:20px'>LOCKED - BY ORDER</div>";
return;
}
if(!user){ location.href='login.html'; return; }
loadProducts(user.uid);
});

function safeText(t){ return typeof Security!=='undefined' && Security.sanitize ? Security.sanitize(t) : (t||'').toString().replace(/[<>]/g,''); }

async function loadProducts(uid){
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
listEl.innerHTML='';
try{
const snap = await db.collection('products').where('uid','==',uid).orderBy('createdAt','desc').get();
if(snap.empty){ emptyEl.style.display='block'; countEl.textContent='0 / 3 Free'; return; }
emptyEl.style.display='none';
countEl.textContent = snap.size + ' / 3 Free';
snap.forEach(doc=>{
const d = doc.data();
const div = document.createElement('div');
div.className='item';
const imgDiv = document.createElement('div');
imgDiv.className='item-img';
if(d.image){
const img = document.createElement('img');
img.src = d.image;
img.onerror = ()=>{ imgDiv.textContent = (d.name||'P').charAt(0).toUpperCase(); };
imgDiv.appendChild(img);
}else{
imgDiv.textContent = (d.name||'P').charAt(0).toUpperCase();
}
const info = document.createElement('div');
info.className='item-info';
const b = document.createElement('b');
b.textContent = safeText(d.name||'Untitled');
const p = document.createElement('p');
p.textContent = safeText((d.category||'physical') + ' - ' + (d.desc||'No description'));
const price = document.createElement('div');
price.className='item-price';
price.textContent = 'PHP ' + (d.price||0);
info.appendChild(b); info.appendChild(p); info.appendChild(price);
const actions = document.createElement('div');
actions.className='item-actions';
const editBtn = document.createElement('button');
editBtn.className='btn-small';
editBtn.textContent='Edit';
editBtn.onclick = ()=> editProduct(doc.id);
const delBtn = document.createElement('button');
delBtn.className='btn-small btn-del';
delBtn.textContent='Delete';
delBtn.onclick = ()=> deleteProduct(doc.id);
actions.appendChild(editBtn); actions.appendChild(delBtn);
div.appendChild(imgDiv); div.appendChild(info); div.appendChild(actions);
listEl.appendChild(div);
});
}catch(e){
console.log(e);
const snap2 = await db.collection('products').where('uid','==',uid).get();
if(snap2.empty){ emptyEl.style.display='block'; return; }
countEl.textContent = snap2.size + ' / 3 Free';
snap2.forEach(doc=>{
const d = doc.data();
const div = document.createElement('div');
div.className='item';
div.textContent = safeText(d.name||'Untitled') + ' - PHP ' + (d.price||0);
listEl.appendChild(div);
});
}
}

async function deleteProduct(id){
if(!confirm('Delete this product?')) return;
try{ await db.collection('products').doc(id).delete(); location.reload(); }catch(e){ alert('Error: '+e.message); }
}
function editProduct(id){ location.href='products.html?edit='+id; }
</script>
</body>
</html>
