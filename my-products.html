<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MagnetraPH - My Products</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:#09080F;color:#fff;font-family:Inter,SF Pro Display,Roboto,sans-serif;}
.top{position:sticky;top:0;z-index:100;background:rgba(9,8,15,0.92);backdrop-filter:blur(16px);border-bottom:1px solid #1C1B2E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:900;font-size:18px;}
.logo b{color:#7C5CFF;}
.btn-back{background:#151325;border:1px solid #25233E;color:#fff;padding:10px 16px;border-radius:12px;font-size:12px;min-height:40px;text-decoration:none;}
.wrap{padding:16px;max-width:700px;margin:0 auto;}
.header-white{background:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,0.18);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.header-white b{color:#11111A;font-size:15px;font-weight:800;}
.header-white span{color:#7C5CFF;font-size:12px;font-weight:800;}
.btn-add{background:#7C5CFF;color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:12px;font-weight:700;min-height:40px;text-decoration:none;box-shadow:0 6px 16px rgba(124,92,255,0.35);}
.list{display:flex;flex-direction:column;gap:12px;}
.item{background:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #F0EEFF;}
.item-img{width:64px;height:64px;background:#F3F0FF;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#7C5CFF;font-weight:900;font-size:18px;overflow:hidden;}
.item-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex:1;min-width:0;}
.item-info b{color:#11111A;font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-info p{color:#6E6D85;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-price{color:#7C5CFF;font-size:12px;font-weight:800;margin-top:4px;}
.item-actions{display:flex;flex-direction:column;gap:8px;}
.btn-small{padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;min-height:34px;cursor:pointer;border:1px solid #E8E5FF;background:#fff;color:#11111A;}
.btn-del{background:#FFF0F0;border-color:#FED7D7;color:#C53030;}
.btn-small:active{transform:scale(0.96);}
.empty{background:#151325;border:1px solid #25233E;border-radius:20px;padding:30px;text-align:center;color:#9A99B5;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="top">
<div class="logo">Magnetra<b>PH</b> - My Products</div>
<a href="dashboard.html" class="btn-back">Back</a>
</div>

<div class="wrap">
<div class="header-white">
<div><b>My Products</b><br><span id="count">0 / 3 Free</span></div>
<a href="products.html" class="btn-add">Add Product</a>
</div>

<div id="list" class="list"></div>
<div id="empty" class="empty" style="display:none;">No products yet. Add your first product. Free 3 max. Equipment Tools Effects Order 3.</div>
</div>

<script src="appcheck.js"></script>
<script src="security.js"></script>
<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "magnetra-ultra.firebaseapp.com",
  projectId: "magnetra-ultra",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try{ firebase.appCheck().activate('6Lf_xxx', true); }catch(e){}

auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='login.html'; return; }
  loadProducts(user.uid);
});

async function loadProducts(uid){
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  listEl.innerHTML='';
  try{
    const snap = await db.collection('products').where('uid','==',uid).orderBy('createdAt','desc').get();
    if(snap.empty){ emptyEl.style.display='block'; countEl.innerText='0 / 3 Free'; return; }
    emptyEl.style.display='none';
    countEl.innerText = snap.size + ' / 3 Free';
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement('div');
      div.className='item';
      const letter = (d.name||'P').charAt(0).toUpperCase();
      div.innerHTML = `
        <div class="item-img">${d.image ? `<img src="${d.image}" onerror="this.parentElement.innerText='${letter}'">` : letter}</div>
        <div class="item-info">
          <b>${d.name||'Untitled'}</b>
          <p>${d.category||'equipment'} - ${d.desc||'No description'}</p>
          <div class="item-price">PHP ${d.price||0}</div>
        </div>
        <div class="item-actions">
          <button class="btn-small" onclick="editProduct('${doc.id}')">Edit</button>
          <button class="btn-small btn-del" onclick="deleteProduct('${doc.id}')">Delete</button>
        </div>
      `;
      listEl.appendChild(div);
    });
  }catch(e){
    console.log(e);
    // Fallback without orderBy if index not created
    const snap2 = await db.collection('products').where('uid','==',uid).get();
    if(snap2.empty){ emptyEl.style.display='block'; return; }
    countEl.innerText = snap2.size + ' / 3 Free';
    snap2.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement('div');
      div.className='item';
      const letter = (d.name||'P').charAt(0).toUpperCase();
      div.innerHTML = `
        <div class="item-img">${d.image ? `<img src="${d.image}">` : letter}</div>
        <div class="item-info">
          <b>${d.name||'Untitled'}</b>
          <p>${d.category||'equipment'} - ${d.desc||'No description'}</p>
          <div class="item-price">PHP ${d.price||0}</div>
        </div>
        <div class="item-actions">
          <button class="btn-small" onclick="editProduct('${doc.id}')">Edit</button>
          <button class="btn-small btn-del" onclick="deleteProduct('${doc.id}')">Delete</button>
        </div>
      `;
      listEl.appendChild(div);
    });
  }
}

async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  try{
    await db.collection('products').doc(id).delete();
    location.reload();
  }catch(e){ alert('Error: '+e.message); }
}

function editProduct(id){
  location.href='products.html?edit='+id;
}
</script>
</body>
</html>
