<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MagnetraPH</title><script src="input.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#000;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}#lP{position:fixed;inset:0;min-height:100dvh;background:radial-gradient(ellipse at top,#1a102e 0%,#050507 70%);display:flex;flex-direction:column;padding:24px 24px 40px;overflow-y:auto;transition:opacity.3s}.card{width:100%;max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.in{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;color:#fff;outline:none;font-size:15px}.btnP{width:100%;background:linear-gradient(180deg,#8B5CF6,#6D28FF);color:#fff;border:none;border-radius:12px;padding:16px;font-weight:800;font-size:16px;cursor:pointer}.btnG{width:100%;background:#fff;border:none;border-radius:12px;padding:14px;color:#111;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer}.row{width:100%;max-width:360px;margin:4px auto 2px;display:flex;justify-content:space-between}.link{color:rgba(255,255,255,.65);font-size:13px;cursor:pointer}.bio{width:100%;max-width:360px;margin:0 auto;padding:13px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:#151515;color:#E5E7EB;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}#pageTrans{position:fixed;inset:0;z-index:99998;background:radial-gradient(ellipse at top,#1a102e 0%,#050507 100%);display:flex;align-items:center;justify-content:center;transform:translateY(100%);opacity:0;transition:all.5s;pointer-events:none}#pageTrans.on{transform:translateY(0);opacity:1;pointer-events:auto}</style></head><body><div id="pageTrans"><div style="width:74px;height:74px;background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div></div><div id="lP"><div style="margin-top:24px;display:flex;flex-direction:column;align-items:center"><div style="width:74px;height:74px;background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div><h1 style="color:#fff;margin:20px 0 0;font-size:32px;font-weight:800">MagnetraPH</h1><p style="color:rgba(255,255,255,.55);font-size:14px;margin-top:8px">Are you ready to build your goal?</p></div><div class="card" style="margin:28px auto 0"><input id="em" class="in" placeholder="Email"><div id="pwWrap" style="position:relative;width:100%"><input id="pw" class="in" type="password" placeholder="Password" style="padding-right:60px"><button type="button" id="eyeBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">show</button></div><div class="row"><a id="helpBtn" class="link">FAQ Help</a><a id="forgotBtn" class="link">Forgot password?</a></div><button class="bio" id="bioBtn"><span id="bioTxt">Enable Biometrics (Bank-Level)</span></button><button id="lB" class="btnP">Log in</button><button id="gB" class="btnG">Continue with Google</button><p id="err" style="color:#FF4D4D;font-size:13px;text-align:center;display:none;font-weight:700"></p><p id="ok" style="color:#22C55E;font-size:13px;text-align:center;display:none"></p></div></div><script id="CFG-LOCK">const CFG=Object.freeze({apiKey:"AIzaSyAvrs7zsH0R0OuAPpTxUs9DzHxE9R3B494",authDomain:"magnetra-ultra.firebaseapp.com",projectId:"magnetra-ultra",appId:"1:114134928326:web:0ce9f84dc043128e7700c7",rc:"6LfM7rUtAAAAACjCTnBHcROLrTUZDwnjTsDle"});</script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{initializeAppCheck,ReCaptchaEnterpriseProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signInWithCustomToken,sendPasswordResetEmail,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";const app=initializeApp(CFG),auth=getAuth(app),fns=getFunctions(app);try{initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(CFG.rc),isTokenAutoRefreshEnabled:true})}catch{}const $=i=>document.getElementById(i),em=$('em'),pw=$('pw'),lb=$('lB'),er=$('err'),ok=$('ok'),trans=$('pageTrans');let fbUser=null;onAuthStateChanged(auth,u=>{fbUser=u; if(u && localStorage.getItem('m_bio_id')) $('bioTxt').textContent='Log in with Biometrics';});const show=(t,g)=>{let e=g?ok:er;e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000);};const goTrans=(u)=>{trans.classList.add('on');document.getElementById('lP').style.opacity='0';setTimeout(()=>{location.href=u},450);};$('eyeBtn').onclick=()=>{pw.type=pw.type==='password'?'text':'password';};$('forgotBtn').onclick=async()=>{let e=em.value.trim().toLowerCase(); if(!e.includes('@')) return show('Enter email first'); try{await sendPasswordResetEmail(auth,e); show('Reset link sent',true);}catch{show('Failed to send reset');}};$('helpBtn').onclick=()=>{location.href='faq.html';};lb.onclick=async()=>{let e=em.value.trim().toLowerCase(),p=pw.value; if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return show('Invalid email'); if(p.length<6) return show('Invalid password'); lb.textContent='Logging in...'; lb.disabled=true; try{await signInWithEmailAndPassword(auth,e,p); if(!auth.currentUser.emailVerified){show('Verify email first'); lb.disabled=false; lb.textContent='Log in'; return;} localStorage.setItem('hasAccount','1'); localStorage.setItem('magnetra_last_email',e); goTrans('home.html');}catch{lb.disabled=false; lb.textContent='Log in'; show('Invalid email or password');}};$('gB').onclick=async()=>{try{let pr=new GoogleAuthProvider(); pr.setCustomParameters({prompt:'select_account'}); await signInWithPopup(auth,pr); localStorage.setItem('hasAccount','1'); if(auth.currentUser?.email) localStorage.setItem('magnetra_last_email',auth.currentUser.email.toLowerCase()); goTrans('home.html');}catch{show('Google auth failed');}};$('bioBtn').onclick=async()=>{try{let hasBio=localStorage.getItem('m_bio_id'); if(!hasBio){ if(!fbUser) return show('Log in with email first to link biometrics'); show('Creating bank-level passkey...',true); let createOpts=httpsCallable(fns,'createPasskeyOptions'); let opts=await createOpts(); let cred=await navigator.credentials.create({publicKey:opts.data}); let credJSON={id:cred.id, rawId:btoa(String.fromCharCode(...new Uint8Array(cred.rawId))), response:{attestationObject:btoa(String.fromCharCode(...new Uint8Array(cred.response.attestationObject))), clientDataJSON:btoa(String.fromCharCode(...new Uint8Array(cred.response.clientDataJSON)))}, type:cred.type}; let verifyReg=httpsCallable(fns,'verifyPasskeyRegistration'); let res=await verifyReg({credential:credJSON}); if(res.data.verified){localStorage.setItem('m_bio_id','1'); $('bioTxt').textContent='Log in with Biometrics'; show('Bank-level enabled! Key saved on server.',true);} return;} let email=em.value.trim().toLowerCase()||localStorage.getItem('magnetra_last_email'); if(!email) return show('Enter email'); show('Verifying on server...',true); let createLoginOpts=httpsCallable(fns,'createPasskeyLoginOptions'); let d=await createLoginOpts({email}); let assertion=await navigator.credentials.get({publicKey:d.data.options}); let assertJSON={id:assertion.id, rawId:btoa(String.fromCharCode(...new Uint8Array(assertion.rawId))), response:{authenticatorData:btoa(String.fromCharCode(...new Uint8Array(assertion.response.authenticatorData))), clientDataJSON:btoa(String.fromCharCode(...new Uint8Array(assertion.response.clientDataJSON))), signature:btoa(String.fromCharCode(...new Uint8Array(assertion.response.signature))), userHandle: assertion.response.userHandle ? btoa(String.fromCharCode(...new Uint8Array(assertion.response.userHandle))) : null}, type:assertion.type}; let verifyLogin=httpsCallable(fns,'verifyPasskeyLogin'); let result=await verifyLogin({credential:assertJSON, uid:d.data.uid}); await signInWithCustomToken(auth,result.data.token); goTrans('home.html');}catch(e){console.log(e); show(e.message||'Biometric failed');}};</script></body></html>
