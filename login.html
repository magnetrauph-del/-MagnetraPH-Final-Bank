<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MagnetraPH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#000;font-family:Inter,sans-serif;touch-action:manipulation}
#lP{position:fixed;inset:0;background:radial-gradient(900px 500px at 50% -10%,#2a1a4d 0%,#050507 75%);display:flex;flex-direction:column;padding:20px 20px 40px;overflow-y:auto;z-index:1;opacity:0;animation:fadeIn.6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.logo{width:80px;height:80px;background:linear-gradient(145deg,#9D6BFF,#6D28FF);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(109,40,255,.45);transition:transform.4s ease}
.logo:active{transform:scale(.92)}
.card{width:100%;max-width:380px;margin:32px auto 0;background:rgba(18,18,20,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:50;transform:translateY(20px);animation:slideUp.7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes slideUp{to{transform:translateY(0)}}
.in{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:17px 56px 17px 17px;color:#fff;outline:none;font-size:15px;transition:all.3s ease}
.in:focus{border-color:#8B5CF6;box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.in.error{border-color:#FF2D55!important;box-shadow:0 0 0 3px rgba(255,45,85,.25),0 0 18px rgba(255,45,85,.6)!important;animation:shake.35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.linkRow{display:flex;justify-content:space-between;position:relative;z-index:120;width:100%}
.linkBtn{background:transparent;border:none;color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;padding:8px 4px;z-index:120;transition:color.2s}
.linkBtn:active{color:#8B5CF6}
.btn{width:100%;border:none;border-radius:16px;padding:17px;font-weight:800;font-size:15px;cursor:pointer;position:relative;z-index:100;transition:all.25s cubic-bezier(.2,.8,.2,1)}
.btn:active{transform:scale(.97)}
.btnBio{width:100%;padding:15px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));color:#EDEEF2;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer;z-index:100;transition:all.25s}
.btnBio:active{transform:scale(.97)}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200}
.sealed{width:100%;max-width:380px;margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.6px}
</style>
</head>
<body>
<div id="lP">
<div style="display:flex;flex-direction:column;align-items:center;margin-top:18px">
<div class="logo"><span style="color:#fff;font-size:40px;font-weight:900">U</span></div>
<h1 style="color:#fff;margin:22px 0 0;font-size:34px;font-weight:900">MagnetraPH</h1>
<p style="color:rgba(255,255,255,.48);font-size:14px;margin-top:6px">Are you ready to build your goal?</p>
</div>
<div class="card">
<input id="em" class="in" placeholder="Email address" autocomplete="email">
<div style="position:relative;width:100%">
<input id="pw" class="in" type="password" placeholder="Password" autocomplete="current-password">
<button id="pwEye" class="eyeBtn" type="button">
<svg id="eOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z"/><circle cx="12" cy="12" r="3.5"/></svg>
<svg id="eClose" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88A3 3 0 0 0 12 15A3 3 0 0 0 14.12 14.12"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5C19 5 23 12 23 12C23 12 21.7 14.1 19.5 15.8"/><path d="M4.5 8.2C3.3 9.9 2 12 2 12C2 12 5 19 12 19C12.9 19 13.7 18.8 14.5 18.5"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
</button>
</div>
<div class="linkRow">
<button id="faqBtn" class="linkBtn" type="button">FAQ Help</button>
<button id="forgotBtn" class="linkBtn" type="button">Forgot password</button>
</div>
<button class="btnBio" id="bioBtn" type="button">Log in with Biometrics</button>
<button class="btn" id="loginBtn" type="button" style="background:linear-gradient(180deg,#8B5CF6,#6D28FF);color:#fff">Log in</button>
<button class="btn" id="googleBtn" type="button" style="background:#fff;color:#111;display:flex;justify-content:center;align-items:center;gap:10px">Continue with Google</button>
</div>
<div class="sealed">SEALED LOCK CODE - BANK LEVEL ENCRYPTED - PROTECTED - MAYA STYLE AUTO</div>
<div style="text-align:center;color:rgba(255,255,255,.45);font-size:13px;margin:16px auto 0;max-width:380px">Don't have an account? <span id="goSignup" style="color:#8B5CF6;font-weight:700;cursor:pointer;padding:8px">Create account</span></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="auth.js?v=12"></script>
</body>
</html>
