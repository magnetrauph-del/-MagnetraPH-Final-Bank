<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MagnetraPH</title>
<link rel="stylesheet" href="login.css?v=4">
</head><body>
<div id="lP">
  <div style="display:flex;flex-direction:column;align-items:center;margin-top:18px;pointer-events:none">
    <div class="logo"><span>U</span></div>
    <h1>MagnetraPH</h1>
    <p>Are you ready to build your goal?</p>
  </div>

  <div class="card">
    <input id="email" class="in field" placeholder="Email address" autocomplete="email">
    <div style="position:relative;width:100%" class="pass-wrap">
      <input id="password" class="in field" type="password" placeholder="Password" autocomplete="current-password">
      <button id="eyeBtn" class="eyeBtn eye-btn" type="button">
        <svg id="eyeOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z"/><circle cx="12" cy="12" r="3.5"/></svg>
        <svg id="eyeClose" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="display:none"><path d="M9.88 9.88A3 3 0 0 0 12 15A3 3 0 0 0 14.12 14.12"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5C19 5 23 12 23 12C23 12 21.7 14.1 19.5 15.8"/><path d="M4.5 8.2C3.3 9.9 2 12 2 12C2 12 5 19 12 19C12.9 19 13.7 18.8 14.5 18.5"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      </button>
    </div>

    <div class="linkRow links">
      <button id="faqBtn" class="linkBtn" type="button">FAQ Help</button>
      <button id="forgotBtn" class="linkBtn" type="button">Forgot password</button>
    </div>

    <button class="btnBio bio-btn" id="bioBtn" type="button">
      <svg class="bio-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><g stroke="#C4B0FF" stroke-width="1.2" stroke-linecap="round"><path d="M12 2.2C7.6 2.2 3.8 5.9 3.8 10.2V15C3.8 19.2 7.6 23 12 23C16.4 23 20.2 19.2 20.2 15V10.2C20.2 5.9 16.4 2.2 12 2.2Z"/><path d="M8 10.2C8 8 9.8 6.2 12 6.2C14.2 6.2 16 8 16 10.2"/></g></svg>
      Log in with Biometrics
    </button>

    <button class="btn login-btn" id="loginBtn" type="button">Log in</button>
    
    <div class="divider"><span>or</span></div>

    <button class="btn google-btn" id="googleBtn" type="button"><svg class="google-icon" width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 9.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Continue with Google</button>
  </div>

  <div class="signup">Don't have an account? <span id="goSignup">Create account</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
</body></html>
