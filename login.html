<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - MagnetraPH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#000;font-family:Inter,-apple-system,sans-serif;overflow:hidden}
#lP{position:fixed;inset:0;min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#2a1a4d 0%,#0a0a0f 55%,#000 100%);display:flex;flex-direction:column;padding:24px 24px 40px;overflow-y:auto}
.logo{width:76px;height:76px;background:linear-gradient(145deg,#9D6BFF 0%,#6D28FF 100%);border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(109,40,255,.35), inset 0 1px 1px rgba(255,255,255,.3)}
.card{width:100%;max-width:380px;margin:32px auto 0;background:rgba(18,18,20,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.in{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:16px 16px;color:#fff;outline:none;font-size:15px;transition:.2s}
.in:focus{border-color:#8B5CF6;background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.btnP{width:100%;background:linear-gradient(180deg,#8B5CF6 0%,#6D28FF 100%);color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;letter-spacing:.3px;box-shadow:0 8px 20px rgba(109,40,255,.35);transition:.2s}
.btnP:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(109,40,255,.45)}.btnP:active{transform:translateY(0)}
.btnG{width:100%;background:#fff;border:none;border-radius:14px;padding:14px;color:#111;font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer;transition:.2s}
.btnG:hover{background:#f5f5f5}
.row{width:100%;max-width:380px;margin:6px auto 2px;display:flex;justify-content:space-between;padding:0 4px}
.link{color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;transition:.2s}.link:hover{color:#fff}
.bio{width:100%;max-width:380px;margin:0 auto;padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));color:#E5E7EB;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.bio:hover{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.12)}
#eyeBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;background:transparent;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.5px}
#pageTrans{position:fixed;inset:0;z-index:99998;background:#000;display:flex;align-items:center;justify-content:center;transform:translateY(100%);opacity:0;transition:all .55s cubic-bezier(.7,0,.3,1);pointer-events:none}
#pageTrans.on{transform:translateY(0);opacity:1;pointer-events:auto}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}}.shake{animation:shake .35s}
</style></head>
<body>
<div id="pageTrans"><div class="logo"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div></div>
<div id="lP">
<div style="margin-top:18px;display:flex;flex-direction:column;align-items:center">
<div class="logo"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div>
<h1 style="color:#fff;margin:22px 0 0;font-size:34px;font-weight:900;letter-spacing:-.5px">MagnetraPH</h1>
<p style="color:rgba(255,255,255,.5);font-size:14px;margin-top:8px;letter-spacing:.2px">Are you ready to build your goal?</p>
</div>
<div class="card">
<input id="em" class="in" placeholder="Email address">
<div style="position:relative;width:100%"><input id="pw" class="in" type="password" placeholder="Password" style="padding-right:64px"><button id="eyeBtn" type="button">SHOW</button></div>
<div class="row"><a id="helpBtn" class="link">FAQ Help</a><a id="forgotBtn" class="link">Forgot password?</a></div>
<button class="bio" id="bioBtn"><span style="width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center">◍</span><span id="bioTxt">Log in with Biometrics</span></button>
<button id="lB" class="btnP">Log in</button>
<button id="gB" class="btnG"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">Continue with Google</button>
<p id="err" style="color:#FF4D4D;font-size:13px;text-align:center;display:none;font-weight:700;margin:2px 0 0"></p>
<p id="ok" style="color:#22C55E;font-size:13px;text-align:center;display:none;margin:2px 0 0"></p>
</div>
</div>
<script src="auth.js" type="module"></script>
</body></html>
