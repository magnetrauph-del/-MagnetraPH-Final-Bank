<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MagnetraPH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#000;font-family:Inter,-apple-system,sans-serif}
#lP{position:fixed;inset:0;min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#2a1a4d 0%,#050507 70%);display:flex;flex-direction:column;padding:20px 20px 40px;overflow-y:auto}
.logo{width:76px;height:76px;background:linear-gradient(145deg,#9D6BFF,#6D28FF);border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(109,40,255,.35)}
.card{width:100%;max-width:380px;margin:28px auto 0;background:rgba(18,18,20,.65);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:13px}
.in{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:16px;color:#fff;outline:none;font-size:15px;transition:.2s}
.in:focus{border-color:#8B5CF6;box-shadow:0 0 0 4px rgba(139,92,246,.15)}.in.error{border-color:#FF3B3B!important;box-shadow:0 0 0 4px rgba(255,59,59,.18),0 0 20px rgba(255,59,59,.25)!important}
.btnP{width:100%;background:linear-gradient(180deg,#8B5CF6,#6D28FF);color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(109,40,255,.35)}
.btnG{width:100%;background:#fff;border:none;border-radius:14px;padding:14px;color:#111;font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer}
.row{width:100%;max-width:380px;margin:4px auto 2px;display:flex;justify-content:space-between}.link{color:rgba(255,255,255,.55);font-size:13px;cursor:pointer}
.bio{width:100%;max-width:380px;margin:0 auto;padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));color:#E5E7EB;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.create{width:100%;max-width:380px;margin:14px auto 0;text-align:center;color:rgba(255,255,255,.45);font-size:13px}.create a{color:#8B5CF6;font-weight:700;text-decoration:none}
#pageTrans{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transform:translateY(105%);opacity:0;transition:.55s cubic-bezier(.7,0,.3,1);pointer-events:none}#pageTrans.on{transform:translateY(0);opacity:1;pointer-events:auto}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}}
.shake{animation:shake .35s}
</style></head><body>
<div id="pageTrans"><div class="logo"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div></div>
<div id="lP">
<div style="display:flex;flex-direction:column;align-items:center;margin-top:16px">
<div class="logo"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div>
<h1 style="color:#fff;margin:20px 0 0;font-size:33px;font-weight:900">MagnetraPH</h1>
<p style="color:rgba(255,255,255,.5);font-size:14px;margin-top:6px">Are you ready to build your goal?</p>
</div>
<div class="card">
<input id="em" class="in" placeholder="Email address">
<div style="position:relative"><input id="pw" class="in" type="password" placeholder="Password" style="padding-right:70px"><button id="eyeBtn" type="button" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:50px;height:40px;background:transparent;border:none;color:rgba(255,255,255,.6);font-weight:800;font-size:11px">SHOW</button></div>
<div class="row"><a id="helpBtn" class="link">FAQ Help</a><a id="forgotBtn" class="link">Forgot password?</a></div>
<button class="bio" id="bioBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="1.7"><path d="M12 2a7 7 0 0 0-7 7v4a7 7 0 0 0 14 0V9a7 7 0 0 0-7-7z"/><path d="M9 13a3 3 0 0 0 6 0v-2a3 3 0 0 0-6 0v2z"/><path d="M12 13v3"/></svg><span id="bioTxt">Log in with Biometrics</span></button>
<button id="lB" class="btnP">Log in</button>
<button id="gB" class="btnG"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">Continue with Google</button>
<p id="err" style="color:#FF3B3B;font-size:13px;text-align:center;display:none;font-weight:700"></p><p id="ok" style="color:#22C55E;font-size:13px;text-align:center;display:none"></p>
</div>
<div class="create">Don't have an account? <a href="create.html">Create account</a></div>
</div>
<script src="auth.js" type="module"></script>
</body></html>
