<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagnetraPH</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="u-logo"><span>U</span></div>
    <h1>MagnetraPH</h1>
    <p>Secure banking for your goals</p>
    <div class="secure-badge">
      <svg viewBox="0 0 16 16" class="shield-icon"><path fill="#8B5CF6" d="M8 0L0 3v4c0 4 2.7 7.4 8 9c5.3-1.6 8-5 8-9V3L8 0Z"/><path fill="#07070b" d="M7.2 11L4.5 8.3l.9-.9L7.2 9.2L10.7 5.7l.9.9L7.2 11Z"/></svg>
      Bank Level Secured
    </div>
  </div>

  <div class="card">
    <div class="card-top">
      <div class="card-line"></div>
      <span>Welcome back</span>
      <div class="card-line"></div>
    </div>

    <input id="email" class="field" type="email" placeholder="Email address" autocomplete="email">
    
    <div class="pass-wrap">
      <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password">
      <button id="eyeBtn" class="eye-btn" type="button">
        <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.6" stroke-linecap="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <svg id="eyeClose" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.6" style="display:none"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.5 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.5 3.8"/><path d="M14.8 14.8A10.8 10.8 0 0 1 12 19c-6.5 0-10-7-10-7a17 17 0 0 1 3.2-4.5"/></svg>
      </button>
    </div>

    <div class="links">
      <button id="faqBtn" type="button">FAQ Help</button>
      <button id="forgotBtn" type="button">Forgot password</button>
    </div>

    <button id="bioBtn" class="bio-btn" type="button">
      <svg class="bio-icon" viewBox="0 0 24 24" fill="none"><g stroke="#C4B0FF" stroke-width="1.1" stroke-linecap="round"><path d="M12 2.5c-2.8 0-5.3 1.7-6.3 4.2M15.9 3c2 1 3.5 2.8 4 5M12 5c-1.7 0-3.1.9-3.7 2.3M14.1 5.4c1 .6 1.7 1.6 1.9 2.8M12 7.2c-.8 0-1.5.5-1.7 1.2M12.9 7.4c.4.2.7.7.8 1.2M12 9.5v1.8M12 13v1.5"/><circle cx="12" cy="16.5" r=".8" fill="#C4B0FF" stroke="none"/></g></svg>
      Log in with Biometrics
    </button>

    <button id="loginBtn" class="login-btn" type="button">Log in</button>

    <div class="divider"><span>or</span></div>

    <button id="googleBtn" class="google-btn" type="button">
      <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
  </div>

  <div class="signup">Don't have an account? <span id="goSignup">Create account</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
</body>
  </html>
