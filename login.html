<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MagnetraPH</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#000;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}#lP{position:fixed;inset:0;min-height:100dvh;background:radial-gradient(ellipse at top,#1a102e 0%,#050507 70%);display:flex;flex-direction:column;padding:24px 24px 40px;overflow-y:auto;transition:opacity .3s}.card{width:100%;max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.in{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;color:#fff;outline:none;font-size:15px}.btnP{width:100%;background:linear-gradient(180deg,#8B5CF6,#6D28FF);color:#fff;border:none;border-radius:12px;padding:16px;font-weight:800;font-size:16px;cursor:pointer}.btnG{width:100%;background:#fff;border:none;border-radius:12px;padding:14px;color:#111;font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer}.row{width:100%;max-width:360px;margin:4px auto 2px;display:flex;justify-content:space-between}.link{color:rgba(255,255,255,.65);font-size:13px;cursor:pointer}.bio{width:100%;max-width:360px;margin:0 auto;padding:13px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:#151515;color:#E5E7EB;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}#pageTrans{position:fixed;inset:0;z-index:99998;background:radial-gradient(ellipse at top,#1a102e 0%,#050507 100%);display:flex;align-items:center;justify-content:center;transform:translateY(100%);opacity:0;transition:all .5s;pointer-events:none}#pageTrans.on{transform:translateY(0);opacity:1;pointer-events:auto}</style></head><body><div id="pageTrans"><div style="width:74px;height:74px;background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div></div><div id="lP"><div style="margin-top:24px;display:flex;flex-direction:column;align-items:center"><div style="width:74px;height:74px;background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div><h1 style="color:#fff;margin:20px 0 0;font-size:32px;font-weight:800">MagnetraPH</h1><p style="color:rgba(255,255,255,.55);font-size:14px;margin-top:8px">Are you ready to build your goal?</p></div><div class="card" style="margin:28px auto 0"><input id="em" class="in" placeholder="Email"><div style="position:relative;width:100%"><input id="pw" class="in" type="password" placeholder="Password" style="padding-right:60px"><button type="button" id="eyeBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;background:transparent;border:none;color:#fff;cursor:pointer">Show</button></div><div class="row"><a id="helpBtn" class="link">FAQ Help</a><a id="forgotBtn" class="link">Forgot password?</a></div><button class="bio" id="bioBtn"><span id="bioTxt">Log in with Biometrics</span></button><button id="lB" class="btnP">Log in</button><button id="gB" class="btnG">Continue with Google</button><p id="err" style="color:#FF4D4D;font-size:13px;text-align:center;display:none;font-weight:700"></p><p id="ok" style="color:#22C55E;font-size:13px;text-align:center;display:none"></p></div></div><script src="auth.js" type="module"></script></body></html>
