<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><script src="input.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#000;font-family:sans-serif}#lP{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a102e 0%,#050507 70%);display:flex;flex-direction:column;padding:24px;overflow:auto}.card{width:100%;max-width:360px;margin:28px auto 0;display:flex;flex-direction:column;gap:12px}.in{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;color:#fff;outline:none}.btnP{width:100%;background:linear-gradient(180deg,#8B5CF6,#6D28FF);color:#fff;border:none;border-radius:12px;padding:16px;font-weight:800;cursor:pointer}.btnG{width:100%;background:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;display:flex;justify-content:center;gap:10px;cursor:pointer}.row{width:100%;max-width:360px;margin:4px auto 2px;display:flex;justify-content:space-between}.link{color:rgba(255,255,255,.65);font-size:13px;cursor:pointer}.bio{width:100%;max-width:360px;margin:0 auto;padding:13px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:#151515;color:#fff;display:flex;justify-content:center;gap:8px;cursor:pointer}</style></head><body><div id="lP"><div style="text-align:center;margin-top:24px"><div style="width:74px;height:74px;background:linear-gradient(145deg,#9D6BFF,#5A20FF);border-radius:20px;display:inline-flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:38px;font-weight:900">U</span></div><h1 style="color:#fff">MagnetraPH</h1></div><div class="card"><input id="em" class="in" placeholder="Email"><div style="position:relative"><input id="pw" class="in" type="password" placeholder="Password" style="padding-right:60px"><button type="button" id="eyeBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#fff;cursor:pointer">show</button></div><div class="row"><a id="helpBtn" class="link">FAQ Help</a><a id="forgotBtn" class="link">Forgot password?</a></div><button class="bio" id="bioBtn"><span id="bioTxt">Enable Biometrics (Bank-Level)</span></button><button id="lB" class="btnP">Log in</button><button id="gB" class="btnG">Continue with Google</button><p id="err" style="color:#FF4D4D;text-align:center;display:none"></p><p id="ok" style="color:#22C55E;text-align:center;display:none"></p></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{initializeAppCheck,ReCaptchaEnterpriseProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signInWithCustomToken,sendPasswordResetEmail,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const CFG={apiKey:"AIzaSyAvrs7zsH0R0OuAPpTxUs9DzHxE9R3B494",authDomain:"magnetra-ultra.firebaseapp.com",projectId:"magnetra-ultra",appId:"1:114134928326:web:0ce9f84dc043128e7700c7",rc:"6LfM7rUtAAAAACjCTnBHcROLrTUZDwnjTsDle"};const app=initializeApp(CFG),auth=getAuth(app),fns=getFunctions(app);try{initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(CFG.rc),isTokenAutoRefreshEnabled:true})}catch{}
const $=i=>document.getElementById(i);let fbUser=null;onAuthStateChanged(auth,u=>{fbUser=u;if(u&&localStorage.getItem('m_bio_id'))$('bioTxt').textContent='Log in with Biometrics';});
const show=(t,g)=>{let e=g?$('ok'):$('err');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000);};
$('eyeBtn').onclick=()=>{pw.type=pw.type==='password'?'text':'password';};$('forgotBtn').onclick=async()=>{let e=em.value.trim();if(!e.includes('@'))return show('Enter email first');try{await sendPasswordResetEmail(auth,e);show('Reset link sent',true);}catch{show('Failed');}};$('helpBtn').onclick=()=>location.href='faq.html';
$('lB').onclick=async()=>{try{await signInWithEmailAndPassword(auth,em.value.trim().toLowerCase(),pw.value);localStorage.setItem('hasAccount','1');localStorage.setItem('magnetra_last_email',em.value.trim().toLowerCase());location.href='home.html';}catch{show('Invalid email or password');}};
$('gB').onclick=async()=>{try{let pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,pr);localStorage.setItem('hasAccount','1');location.href='home.html';}catch{show('Google auth failed');}};
$('bioBtn').onclick=async()=>{
try{
let has=localStorage.getItem('m_bio_id');
if(!has){
if(!fbUser)return show('Log in with email first to link');
show('Creating bank-level passkey...',true);
let opt=await httpsCallable(fns,'createPasskeyOptions')();
let cred=await navigator.credentials.create({publicKey:opt.data});
let j={id:cred.id,rawId:btoa(String.fromCharCode(...new Uint8Array(cred.rawId))),response:{attestationObject:btoa(String.fromCharCode(...new Uint8Array(cred.response.attestationObject))),clientDataJSON:btoa(String.fromCharCode(...new Uint8Array(cred.response.clientDataJSON)))},type:cred.type};
let res=await httpsCallable(fns,'verifyPasskeyRegistration')({credential:j});
if(res.data.verified){localStorage.setItem('m_bio_id','1');$('bioTxt').textContent='Log in with Biometrics';show('Bank-level enabled! Nasa server na key mo.',true);}
return;
}
let email=em.value.trim().toLowerCase()||localStorage.getItem('magnetra_last_email');if(!email)return show('Enter email');
show('Verifying on server...',true);
let d=await httpsCallable(fns,'createPasskeyLoginOptions')({email});
let a=await navigator.credentials.get({publicKey:d.data.options});
let aj={id:a.id,rawId:btoa(String.fromCharCode(...new Uint8Array(a.rawId))),response:{authenticatorData:btoa(String.fromCharCode(...new Uint8Array(a.response.authenticatorData))),clientDataJSON:btoa(String.fromCharCode(...new Uint8Array(a.response.clientDataJSON))),signature:btoa(String.fromCharCode(...new Uint8Array(a.response.signature))),userHandle:a.response.userHandle?btoa(String.fromCharCode(...new Uint8Array(a.response.userHandle))):null},type:a.type};
let r=await httpsCallable(fns,'verifyPasskeyLogin')({credential:aj,uid:d.data.uid});
await signInWithCustomToken(auth,r.data.token);location.href='home.html';
}catch(e){console.log(e);show(e.message||'Biometric failed');}
};
</script></body></html>
