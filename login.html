<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MagnetraPH - Secure Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="u-logo">U</div>
    <h1>MagnetraPH</h1>
    <p>Secure e-wallet login</p>
  </div>

  <div class="card">
    <input id="email" class="field" type="email" placeholder="Email address" autocomplete="email">
    
    <div class="pass-wrap">
      <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password">
      <button id="eyeBtn" class="eye" type="button">👁</button>
    </div>

    <div class="links">
      <button id="faqBtn" type="button">FAQ Help</button>
      <button id="forgotBtn" type="button">Forgot password</button>
    </div>

    <button id="bioBtn" class="bio-btn" type="button">
      <svg class="fp-icon" viewBox="0 0 24 24" fill="none">
        <path d="M12 3C9.5 3 7.3 4.5 6.5 7C5.7 9.5 6 12.5 7.6 15M15.2 3.8C17 4.7 18.5 6.5 19 8.8C19.5 11.1 18.8 13.8 17.3 15.8M12 5.5C10.3 5.5 8.8 6.6 8.3 8.3C7.8 10 8.1 11.9 9.2 13.4M13.7 5.9C14.9 6.6 15.8 8 16 9.5C16.2 11 15.5 12.6 14.3 13.6M12 7.5C11 7.5 10.1 8.2 9.9 9.2C9.7 10.2 10.2 11.2 11 11.7M12 11.5V16M12 18.5V19.5" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Log in with Biometrics
    </button>

    <button id="loginBtn" class="primary-btn" type="button">Log in</button>
    
    <button id="googleBtn" class="google-btn" type="button">
      <span class="g-icon">G</span> Continue with Google
    </button>
  </div>

  <div class="signup">Don't have an account? <span id="goSignup">Create account</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
</body>
</html>
