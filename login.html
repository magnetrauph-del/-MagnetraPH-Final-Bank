<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - Sureball</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h2>Login Create Account</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
  <p id="status"></p>

<script>
  const firebaseConfig = {
    apiKey: "ILAGAY_API_KEY_MO_DITO",
    authDomain: "PROJECT_MO.firebaseapp.com",
    projectId: "PROJECT_MO"
  };
  firebase.initializeApp(firebaseConfig);

  async function signup() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    document.getElementById('status').innerText = "Creating account...";
    try {
      const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
      await new Promise(r => setTimeout(r, 3000));
      document.getElementById('status').innerText = "Success profile created";
    } catch (e) {
      document.getElementById('status').innerText = "Error: " + e.message;
    }
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    document.getElementById('status').innerText = "Logging in...";
    try {
      await firebase.auth().signInWithEmailAndPassword(email, password);
      const uid = firebase.auth().currentUser.uid;
      const doc = await firebase.firestore().collection("users").doc(uid).get();
      if (!doc.exists) {
        document.getElementById('status').innerText = "Please wait profile is being created refresh after 5 seconds";
        return;
      }
      const data = doc.data();
      document.getElementById('status').innerText = "Login OK Status: " + data.subscriptionStatus + " Role: " + data.role;
    } catch (e) {
      document.getElementById('status').innerText = "Error: " + e.message;
    }
  }
</script>
</body>
</html>
