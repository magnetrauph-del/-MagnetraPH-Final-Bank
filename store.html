<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MagnetraPH Store</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:#09080F;color:#fff;font-family:Inter,SF Pro Display,Roboto,sans-serif;}
.top{position:sticky;top:0;z-index:100;background:rgba(9,8,15,0.92);backdrop-filter:blur(16px);border-bottom:1px solid #1C1B2E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:900;font-size:18px;}
.logo b{color:#7C5CFF;}
.btn-dash{background:#fff;color:#11111A;padding:10px 16px;border-radius:12px;font-size:12px;font-weight:800;min-height:40px;text-decoration:none;box-shadow:0 4px 12px rgba(255,255,255,0.15);}
.wrap{padding:16px;max-width:700px;margin:0 auto;}
.store-head{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,0.18);margin-bottom:16px;}
.store-head b{color:#11111A;font-size:16px;font-weight:800;}
.store-head p{color:#6E6D85;font-size:11px;margin-top:6px;line-height:1.5;}
.store-head .tag{display:inline-block;margin-top:10px;background:#F3F0FF;color:#7C5CFF;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.item{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #F0EEFF;cursor:pointer;}
.item-img{width:100%;height:110px;background:#F3F0FF;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#7C5CFF;font-weight:900;font-size:22px;overflow:hidden;margin-bottom:10px;}
.item-img img{width:100%;height:100%;object-fit:cover;}
.item b{color:#11111A;font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item p{color:#6E6D85;font-size:10.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-price{color:#7C5CFF;font-size:12.5px;font-weight:800;margin-top:6px;}
.btn-buy{width:100%;margin-top:10px;background:#11111A;color:#fff;border:none;border-radius:10px;padding:9px;font-size:11px;font-weight:700;min-height:36px;cursor:pointer;}
.btn-buy:active{transform:scale(0.97);}
.empty{background:#151325;border:1px solid #25233E;border-radius:20px;padding:30px;text-align:center;color:#9A99B5;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="top">
<div class="logo">Magnetra<b>PH</b> Store</div>
<a href="dashboard.html" class="btn-dash">Dashboard</a>
</div>

<div class="wrap">
<div class="store-head">
<b id="storeName">Loading store...</b>
<p id="storeDesc">Any legal product - Equipment Tools Effects - PayMongo Direct - Magnetra never holds money</p>
<div class="tag">Free Store Link - Public - No login needed</div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none;">No products yet. This seller has no products.</div>
</div>

<script src="appcheck.js"></script>
<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "magnetra-ultra.firebaseapp.com",
  projectId: "magnetra-ultra",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
try{ firebase.appCheck().activate('6Lf_xxx', true); }catch(e){}

async function load(){
  const urlParams = new URLSearchParams(window.location.search);
  const uid = urlParams.get('uid');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const nameEl = document.getElementById('storeName');

  if(!uid){
    // if no uid - show latest products as marketplace
    nameEl.innerText = 'MagnetraPH Marketplace';
    document.getElementById('storeDesc').innerText = 'Public marketplace - all sellers - Equipment Tools Effects';
    try{
      const snap = await db.collection('products').where('status','==','active').limit(20).get();
      if(snap.empty){ empty.style.display='block'; return; }
      snap.forEach(doc=>{
        const d = doc.data();
        const div = document.createElement('div');
        div.className='item';
        const letter = (d.name||'P').charAt(0).toUpperCase();
        div.innerHTML = `
          <div class="item-img">${d.image ? `<img src="${d.image}" onerror="this.parentElement.innerText='${letter}'">` : letter}</div>
          <b>${d.name||'Product'}</b>
          <p>${d.category||''}</p>
          <div class="item-price">PHP ${d.price||0}</div>
          <button class="btn-buy" onclick="buy('${doc.id}')">Buy - PayMongo Direct</button>
        `;
        grid.appendChild(div);
      });
    }catch(e){ empty.style.display='block'; empty.innerText='Error loading: '+e.message; }
    return;
  }

  // with uid - specific seller store
  try{
    const userDoc = await db.collection('users').doc(uid).get();
    if(userDoc.exists){
      nameEl.innerText = (userDoc.data().displayName || 'Seller') + ' Store';
    }else{
      nameEl.innerText = 'Seller Store';
    }
    const snap = await db.collection('products').where('uid','==',uid).where('status','==','active').get();
    if(snap.empty){ empty.style.display='block'; return; }
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement('div');
      div.className='item';
      const letter = (d.name||'P').charAt(0).toUpperCase();
      div.innerHTML = `
        <div class="item-img">${d.image ? `<img src="${d.image}" onerror="this.parentElement.innerText='${letter}'">` : letter}</div>
        <b>${d.name||'Product'}</b>
        <p>${d.category||''}</p>
        <div class="item-price">PHP ${d.price||0}</div>
        <button class="btn-buy" onclick="buy('${doc.id}')">Buy - PayMongo Direct</button>
      `;
      grid.appendChild(div);
    });
  }catch(e){ empty.style.display='block'; empty.innerText='Error: '+e.message; }
}

function buy(id){
  alert('PayMongo Direct - Seller to buyer - Contact seller for payment - Order ID: '+id);
}

load();
</script>
</body>
                              </html>
