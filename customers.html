<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MagnetraPH - Customers</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:#09080F;color:#fff;font-family:Inter,SF Pro Display,Roboto,sans-serif;}
.top{position:sticky;top:0;z-index:100;background:rgba(9,8,15,0.92);backdrop-filter:blur(16px);border-bottom:1px solid #1C1B2E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:900;font-size:18px;}
.logo b{color:#7C5CFF;}
.btn-back{background:#151325;border:1px solid #25233E;color:#fff;padding:10px 16px;border-radius:12px;font-size:12px;min-height:40px;text-decoration:none;}
.wrap{padding:16px;max-width:700px;margin:0 auto;}
.head-white{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,0.18);margin-bottom:16px;}
.head-white b{color:#11111A;font-size:15px;font-weight:800;}
.head-white p{color:#6E6D85;font-size:11px;margin-top:6px;line-height:1.5;}
.head-white.count{margin-top:12px;background:#F3F0FF;color:#7C5CFF;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.list{display:flex;flex-direction:column;gap:12px;}
.customer{background:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #F0EEFF;}
.avatar{width:48px;height:48px;background:#F3F0FF;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#7C5CFF;font-weight:900;font-size:16px;flex-shrink:0;}
.info{flex:1;min-width:0;}
.info b{color:#11111A;font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.info p{color:#6E6D85;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.info span{color:#7C5CFF;font-size:10px;font-weight:700;margin-top:4px;display:block;}
.empty{background:#151325;border:1px solid #25233E;border-radius:20px;padding:30px;text-align:center;color:#9A99B5;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="top">
<div class="logo">Magnetra<b>PH</b> - Customers</div>
<a href="dashboard.html" class="btn-back">Back</a>
</div>

<div class="wrap">
<div class="head-white">
<b>Your Buyers - PayMongo Direct</b>
<p>List of buyers who bought via PayMongo Direct - Magnetra never holds money - Safe - Direct user to user</p>
<div class="count" id="count">0 customers</div>
</div>

<div id="list" class="list"></div>
<div id="empty" class="empty" style="display:none;">No customers yet - buyers will show here after they buy</div>
</div>

<script src="appcheck.js"></script>
<script src="security.js"></script>
<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "magnetra-ultra.firebaseapp.com",
  projectId: "magnetra-ultra",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try{ firebase.appCheck().activate('6Lf_xxx', true); }catch(e){}

auth.onAuthStateChanged(user=>{
  if(!user){ location.href='login.html'; return; }
  loadCustomers(user.uid);
});

async function loadCustomers(uid){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  list.innerHTML='';
  try{
    const snap = await db.collection('orders').where('sellerUid','==',uid).get();
    if(snap.empty){ empty.style.display='block'; countEl.innerText='0 customers'; return; }
    const buyers = {};
    snap.forEach(doc=>{
      const d = doc.data();
      const buyerId = d.buyerUid || 'unknown';
      if(!buyers[buyerId]){
        buyers[buyerId] = { count:0, last: d.createdAt, product: d.productName };
      }
      buyers[buyerId].count++;
    });
    const keys = Object.keys(buyers);
    if(keys.length===0){ empty.style.display='block'; return; }
    countEl.innerText = keys.length + ' customers - ' + snap.size + ' orders';
    empty.style.display='none';
    keys.forEach(buyerId=>{
      const b = buyers[buyerId];
      const letter = buyerId.charAt(0).toUpperCase();
      const div = document.createElement('div');
      div.className='customer';
      div.innerHTML = `
        <div class="avatar">${letter}</div>
        <div class="info">
          <b>${buyerId.slice(0,12)}</b>
          <p>Last: ${b.product||'Product'} - ${b.count} order(s)</p>
          <span>PayMongo Direct - Safe</span>
        </div>
      `;
      list.appendChild(div);
    });
  }catch(e){
    empty.style.display='block';
    empty.innerText='No customers yet - safe mode';
  }
}
</script>
</body>
</html>
